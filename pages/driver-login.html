<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Login | Al Taj Al Malaky</title>
  <link rel="stylesheet" href="../src/css/styles.css" />
</head>
<body class="admin-login-page">

  <main class="admin-login-shell">
    <div class="container">
      <section class="admin-login-layout" aria-labelledby="driverLoginTitle">
        <article class="admin-login-brand">
          <div class="admin-login-brand-inner">
            <span class="admin-login-eyebrow">Driver Access</span>
            <h1>Al Taj Al Malaky</h1>
            <h2>Driver Dashboard</h2>
            <p>
              Check assigned deliveries, start routes, and share your live location from your phone.
            </p>

            <div class="admin-login-brand-note">
              This secure sign-in is for approved delivery drivers only.
            </div>
          </div>
        </article>

        <article class="admin-login-card form-card">
          <div class="admin-login-card-head">
            <span class="admin-login-kicker">Secure Sign In</span>
            <h2 id="driverLoginTitle">Welcome back</h2>
            <p>Use your driver email and password to access assigned orders.</p>
          </div>

          <form id="driverLoginForm" class="form-grid" novalidate>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="driver@company.com" autocomplete="email" required />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
            </div>

            <button id="driverLoginBtn" class="btn btn-primary admin-login-btn" type="submit">
              Login to Driver Dashboard
            </button>

            <p id="driverLoginError" class="admin-login-error" role="alert" aria-live="polite"></p>
          </form>
        </article>
      </section>
    </div>
  </main>

  <script type="module" src="../src/js/driver-login.js"></script>

</body>
</html>
